[package]
name = "micdeck"
description = "MicDeck – Linux companion for the DJI Mic Mini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "micdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
# User-supplied device pictures are handed to the window as data URLs.
base64 = "0.22"
micdeck-core = { workspace = true }
usb-link = { workspace = true }
audio-pw = { workspace = true }
# Panel icon over StatusNotifierItem; Tauri's tray gets no clicks on Cinnamon.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
notify-rust = "4.18"
# Presses Claude's dictation shortcut for the charging-case trigger.
x11rb = { version = "0.14", features = ["xtest"] }
tauri-plugin-single-instance = "2"

[features]
# Enabled by `tauri build`: serve the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
